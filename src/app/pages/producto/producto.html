<div class="container-xl mt-5 mb-5">

    <div *ngIf="productQuery.isLoading()" class="loading-state text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2">Preparando tu vista...</p>
    </div>

    <div *ngIf="productQuery.data() as product" class="product-wrapper shadow-lg">
        <div class="row g-0">

            <div class="col-lg-7 image-section">
                <div class="badge-new">Colección 2025</div>
                <img [src]="product.imagenKey | urlS3" [alt]="product.nombre" class="main-product-img">
            </div>

            <div class="col-lg-5 info-section">
                <div class="info-content">
                    <nav class="breadcrumb-nav">
                        <span routerLink="/catalogo">Catálogo</span> / <span>Lentes</span>
                    </nav>

                    <h1 class="product-title">{{ product.nombre }}</h1>

                    <div class="price-container">
                        <span class="currency">$</span>
                        <span class="amount">{{ product.precio | number:'1.0-0' }}</span>
                    </div>

                    <div class="description-box">
                        <p>{{ product.descripcion }}</p>
                    </div>

                    <div class="mt-4 mb-4">
                        <app-prescription-upload (prescriptionUploaded)="onPrescriptionAttached($event)">
                        </app-prescription-upload>
                    </div>

                    <div class="action-area">
                        <button class="btn-add-cart w-100" (click)="addToCart()" [disabled]="!prescriptionId"
                            [ngClass]="{'btn-secondary': !prescriptionId, 'btn-primary': prescriptionId}">
                            
                            <span *ngIf="!prescriptionId">Adjunta tu fórmula para continuar</span>
                            <span *ngIf="prescriptionId">Añadir al Carrito</span>
                            <i [class]="prescriptionId ? 'bi bi-cart-plus ms-2' : 'bi bi-lock ms-2'"></i>
                        </button>

                        <button routerLink="/catalogo" class="btn btn-outline-dark w-100 mt-2 py-2">
                            <i class="bi bi-arrow-left me-2"></i> Explorar otros modelos
                        </button>
                    </div>

                    <div class="trust-indicators d-flex justify-content-between mt-4 pt-3 border-top text-muted small">
                        <span><i class="bi bi-truck me-1"></i> Envío Gratis</span>
                        <span><i class="bi bi-shield-check me-1"></i> Garantía 12 meses</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div *ngIf="productQuery.isError() || (productQuery.isSuccess() && !productQuery.data())" 
         class="error-state text-center py-5">
        <i class="bi bi-search" style="font-size: 3rem; color: #ccc;"></i>
        <h3 class="mt-3">Lo sentimos, no encontramos ese modelo</h3>
        <button routerLink="/catalogo" class="btn btn-dark mt-3 px-4">Volver al catálogo</button>
    </div>
</div>
